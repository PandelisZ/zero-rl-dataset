# RL on the graph-native target: checked ProgramGraph edits (zero_graph_edit).
# This is the primary training target — rewards the graph-patch action, not text.
# Schema matches `prime train init`. Launch: prime train prime/train.graph.toml
model = "poolside/Laguna-XS.2"
max_steps = 150

batch_size = 64              # 64 / 8 = 8 unique prompts per step
rollouts_per_example = 8
learning_rate = 1e-6

[sampling]
max_tokens = 4096            # multi-turn tool loop needs room
temperature = 0.7

[[env]]
id = "pandelis/zero-verifiers-env"
args = { family = "zero_graph_edit", split = "train" }

[val]
num_examples = 18
rollouts_per_example = 2
interval = 10

[checkpoints]
interval = 25
keep_cloud = 4
