# Graph-edit RL test run on the de-ambiguated tasks (env v0.4.2+).
# Watch graph_patch_success lift off 0 as the policy learns to land checked
# patches on the unique target node. 50 steps; Laguna XS.2 ($0).
model = "poolside/Laguna-XS.2"
max_steps = 50

batch_size = 48              # 48 / 8 = 6 unique prompts/step
rollouts_per_example = 8
learning_rate = 1e-6

[sampling]
max_tokens = 4096
temperature = 0.7

[[env]]
id = "pandelis/zero-verifiers-env"
args = { family = "zero_graph_edit", split = "train" }

[val]
num_examples = 16
rollouts_per_example = 2
interval = 25

[checkpoints]
interval = 25
keep_cloud = 2
