# Tiny hosted-training smoke run — verify RL actually steps and reward moves.
# Schema matches `prime train init`. Launch: prime train prime/train.smoke.toml
# Laguna XS.2 is $0 for hosted training. Single env (zero_native) for a robust
# first run; scale with prime/train.zero.toml.
model = "poolside/Laguna-XS.2"
max_steps = 10

batch_size = 32              # 32 / 8 = 4 unique prompts per step
rollouts_per_example = 8
learning_rate = 1e-6

[sampling]
max_tokens = 2048
temperature = 0.7

[[env]]
id = "pandelis/zero-verifiers-env"
args = { family = "zero_native", split = "train" }

[val]
num_examples = 16
rollouts_per_example = 1
interval = 5

[checkpoints]
interval = 5
keep_cloud = 2
