# Small graph-edit test run on a SUBSET — verify the graph-native target trains
# end-to-end (tool loop + checked-patch rubric) and watch graph_patch_success.
# Subset via args.max_examples; short max_steps. Laguna XS.2 ($0).
# Launch: prime train prime/train.graph-smoke.toml
model = "poolside/Laguna-XS.2"
max_steps = 20

batch_size = 32              # 32 / 8 = 4 unique prompts per step
rollouts_per_example = 8
learning_rate = 1e-6

[sampling]
max_tokens = 4096            # multi-turn tool loop
temperature = 0.7

[[env]]
id = "pandelis/zero-verifiers-env"
args = { family = "zero_graph_edit", split = "train", max_examples = 80 }

[val]
num_examples = 8
rollouts_per_example = 2
interval = 10

[checkpoints]
interval = 10
keep_cloud = 2
